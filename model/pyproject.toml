[project]
name = "aera-vision"
version = "0.1.0"
description = "People-counting model selection and evaluation for AERA's in-train camera sensors"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "pillow>=10.4",
  "opencv-python-headless>=4.10",
  "torch>=2.5",
  "torchvision>=0.20",
  "ultralytics>=8.3.200",
  "rfdetr>=1.3",
  "onnxruntime>=1.20",
  "pycocotools>=2.0.8",
  "matplotlib>=3.9",
  "jsonschema>=4.23",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "timm>=1.0.31",
  "einops>=0.8.2",
  "peft>=0.21.3",
  "onnx>=1.23.2",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.uv]
package = false

[tool.ruff]
line-length = 135
target-version = "py312"
exclude = ["aera_vision/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
"aera_vision/report.py" = ["E501"]  # long prose strings
"aera_vision/figures.py" = ["E501"]  # long figure captions
